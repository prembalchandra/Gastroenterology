<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Checkup Banner</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Noto Sans Devanagari', sans-serif;
    }

    .hero-banner {
      width: 100%;
      min-height: 440px;
      background: linear-gradient(115deg, #fdf6f9 0%, #ffffff 48%, #f4f7fc 100%);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px 0 20px;
      overflow: hidden;
    }

    /* Background Decorative '+' and Circle */
    .bg-plus {
      position: absolute;
      top: 15px;
      left: 57%;
      font-size: 135px;
      font-weight: 700;
      color: rgba(184, 41, 99, 0.045);
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    .bg-circle {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 330px;
      height: 330px;
      background: radial-gradient(circle, rgba(184, 41, 99, 0.07) 0%, rgba(255, 255, 255, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .hero-container {
      max-width: 1220px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: relative;
      z-index: 2;
    }

    /* Left Content */
    .hero-content {
      flex: 1.1;
      padding-bottom: 30px;
    }

    .accent-line {
      width: 36px;
      height: 2.5px;
      background-color: #b82963;
      margin-bottom: 18px;
    }

    .hero-title {
      font-size: 40px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 14px;
    }

    .text-blue {
      color: #163366;
    }

    .text-pink {
      color: #b82963;
    }

    .hero-subtitle {
      font-size: 14px;
      color: #646e7c;
      line-height: 1.65;
      margin-bottom: 26px;
    }

    /* Buttons */
    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .btn-primary {
      background-color: #1c5ba6;
      color: #ffffff;
      border: 1.5px solid #1c5ba6;
      box-shadow: 0 4px 12px rgba(28, 91, 166, 0.25);
    }

    .btn-primary:hover {
      background-color: #154682;
    }

    .btn-outline {
      background-color: #ffffff;
      color: #163366;
      border: 1.5px solid #c8d6e8;
    }

    .btn-outline:hover {
      border-color: #1c5ba6;
      background-color: #f4f8fd;
    }

    /* Center Image */
    .hero-image {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      align-self: flex-end;
    }

    .hero-image img {
      max-width: 100%;
      height: auto;
      max-height: 370px;
      object-fit: contain;
      display: block;
      mix-blend-mode: multiply; /* White background ko blend karne ke liye */
    }

    /* Right Form Card */
    .hero-form-card {
      flex: 0.9;
      max-width: 365px;
      width: 100%;
      background: #ffffff;
      padding: 26px 24px;
      border-radius: 14px;
      box-shadow: 0 10px 35px rgba(22, 51, 102, 0.08);
      margin-bottom: 30px;
    }

    .form-title {
      font-size: 19px;
      font-weight: 700;
      color: #163366;
      margin-bottom: 18px;
    }

    .input-group {
      position: relative;
      margin-bottom: 12px;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 11px 14px 11px 40px;
      border: 1px solid #e6ebf1;
      border-radius: 8px;
      font-size: 13.5px;
      color: #334155;
      background-color: #ffffff;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input::placeholder {
      color: #94a3b8;
    }

    .input-group input:focus,
    .input-group select:focus {
      border-color: #1c5ba6;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #1c5ba6;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: background-color 0.25s ease;
    }

    .btn-submit:hover {
      background-color: #154682;
    }

    .privacy-note {
      font-size: 11px;
      color: #8b95a5;
      text-align: center;
      margin-top: 12px;
    }

    /* Mobile Responsive */
    @media (max-width: 992px) {
      .hero-banner {
        padding: 30px 20px;
      }
      .hero-container {
        flex-direction: column;
        text-align: center;
      }
      .accent-line {
        margin: 0 auto 16px;
      }
      .hero-buttons {
        justify-content: center;
      }
      .hero-image {
        align-self: center;
      }
      .hero-form-card {
        max-width: 100%;
        margin-bottom: 0;
      }
    }
  </style>
</head>
<body>

  <section class="hero-banner">
    <!-- Background Decorative Shapes -->
    <div class="bg-plus">+</div>
    <div class="bg-circle"></div>

    <div class="hero-container">
      
      <!-- Left Content -->
      <div class="hero-content">
        <div class="accent-line"></div>
        <h1 class="hero-title">
          <span class="text-blue">आज ही अपने</span><br>
          <span class="text-pink">हृदय की जाँच कराएँ</span>
        </h1>
        <p class="hero-subtitle">
          फॉर्म भरें - हमारी टीम 10 मिनट के अंदर आपको कॉल करेगी<br>
          और आपके नज़दीकी उजाला सिग्नस अस्पताल में<br>
          अपॉइंटमेंट फिक्स करेगी।
        </p>

        <div class="hero-buttons">
          <a href="#book" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            अपॉइंटमेंट बुक करें →
          </a>
          <a href="tel:9146691466" class="btn btn-outline">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1d5ca8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
            91466 91466
          </a>
        </div>
      </div>

      <!-- Center Doctor Image -->
      <div class="hero-image">
        <!-- ऊपर दी गई इमेज को download करके 'doctor-patient.jpg' नाम से इसी folder में save करें -->
        <img src="../images/compassionate-doctor-patient-consultation-img.png" alt="Doctor consulting patient">
      </div>

      <!-- Right Callback Form Card -->
      <div class="hero-form-card">
        <h2 class="form-title">फ्री कॉलबैक बुक करें</h2>
        <form action="#" method="POST">
          
          <div class="input-group">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1d5ca8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </span>
            <input type="text" placeholder="आपका नाम *" required>
          </div>

          <div class="input-group">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1d5ca8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
            </span>
            <input type="tel" placeholder="मोबाइल नंबर (10 अंक) *" pattern="[0-9]{10}" required>
          </div>

          <div class="input-group">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1d5ca8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            </span>
            <select required>
              <option value="" disabled selected>शहर *</option>
              <option value="delhi">दिल्ली</option>
              <option value="noida">नोएडा</option>
              <option value="karnal">करनाल</option>
              <option value="varanasi">वाराणसी</option>
            </select>
          </div>

          <button type="submit" class="btn-submit">कॉलबैक चाहिए →</button>
          <p class="privacy-note">आपकी जानकारी पूरी तरह गोपनीय रखी जाती है।</p>
        </form>
      </div>

    </div>
  </section>

</body>
</html>
